<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1584" viewBox="0 0 1200 1584" role="img" aria-labelledby="title description">
<title id="title">Путь Sora: от первого показа к переговорам о кино</title>
<desc id="description">15 февраля 2024 — Первый показ Sora; 9 декабря 2024 — Выход Sora Turbo; 30 сентября 2025 — Sora 2 и новое приложение; 24 марта 2026 — Объявлено об отключении Videos API; 26 апреля 2026 — Закрыты сайт и приложение; 24 сентября 2026 — Отключён Videos API; 12 октября 2026 — СМИ сообщают о переговорах со стартапом для кино.</desc>
<rect width="1200" height="1584" fill="#F4F4F0"/>
<text x="76" y="76" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#355CDF">2024–2026</text>
<text x="76" y="174" font-family="DejaVu Sans, sans-serif" font-size="84" font-weight="700" fill="#182231">Путь Sora</text>
<text x="76" y="246" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="400" fill="#526173">От первого показа к переговорам о кино</text>
<rect x="76" y="304" width="1048" height="142" rx="24" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2"/>
<text x="108" y="352" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#355CDF">15 февраля 2024</text>
<text x="108" y="415" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">Первый показ Sora</text>
<rect x="76" y="466" width="1048" height="142" rx="24" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2"/>
<text x="108" y="514" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#355CDF">9 декабря 2024</text>
<text x="108" y="577" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">Выход Sora Turbo</text>
<rect x="76" y="628" width="1048" height="142" rx="24" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2"/>
<text x="108" y="676" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#355CDF">30 сентября 2025</text>
<text x="108" y="739" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">Sora 2 и новое приложение</text>
<rect x="76" y="790" width="1048" height="194" rx="24" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2"/>
<text x="108" y="838" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#355CDF">24 марта 2026</text>
<text x="108" y="901" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">Объявлено об отключении</text>
<text x="108" y="953" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">Videos API</text>
<rect x="76" y="1004" width="1048" height="142" rx="24" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2"/>
<text x="108" y="1052" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#355CDF">26 апреля 2026</text>
<text x="108" y="1115" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">Закрыты сайт и приложение</text>
<rect x="76" y="1166" width="1048" height="142" rx="24" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2"/>
<text x="108" y="1214" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#355CDF">24 сентября 2026</text>
<text x="108" y="1277" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">Отключён Videos API</text>
<rect x="76" y="1328" width="1048" height="194" rx="24" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2"/>
<text x="108" y="1376" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#355CDF">12 октября 2026</text>
<text x="108" y="1439" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">СМИ сообщают о переговорах</text>
<text x="108" y="1491" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="400" fill="#182231">со стартапом для кино</text>
</svg>
