<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380" role="img" aria-labelledby="title description">
<title id="title">Восемь мультфильмов из карьеры Джеффри Катценберга</title>
<desc id="description">Disney: Катценберг возглавлял Walt Disney Studios в 1984–1994 годах. Русалочка, 1989; Красавица и чудовище, 1991; Аладдин, 1992; Король Лев, 1994. DreamWorks: Катценберг — сооснователь студии. Шрек, 2001; Мадагаскар, 2005; Кунг-фу Панда, 2008; Как приручить дракона, 2010.</desc>
