<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Keyframes: опорные изображения и переходы между ними</title>
<desc id="description">Оригинальная редакционная схема. Автор задаёт три изображения условной бутылки в нужном порядке, модель создаёт переходы. Полная Kling 4.0 поддерживает до десяти ключевых кадров. Omni Reference и Keyframes — отдельные режимы.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#EFF4F5" />
