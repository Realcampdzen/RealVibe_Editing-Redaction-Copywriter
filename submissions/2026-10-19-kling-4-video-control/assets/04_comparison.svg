family="DejaVu Sans" font-size="60" font-weight="700" text-anchor="middle" fill="#FFFFFF" >Моно</text><text x="1267" y="687" font-family="DejaVu Sans" font-size="60" font-weight="700" text-anchor="middle" fill="#D6EE83" >Стерео</text><line x1="983" y1="341" x2="1046" y2="341" stroke="#66CEBE" stroke-width="5" stroke-linecap="round" /><path d="M 1033,328 L 1049,341 L 1033,354" fill="none" stroke="#66CEBE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="983" y1="503" x2="1046" y2="503" stroke="#66CEBE" stroke-width="5" stroke-linecap="round" /><path d="M 1033,490 L 1049,503 L 1033,516" fill="none" stroke="#66CEBE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="983" y1="665" x2="1046" y2="665" stroke="#66CEBE" stroke-width="5" stroke-linecap="round" /><path d="M 1033,652 L 1049,665 L 1033,678" fill="none" stroke="#66CEBE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="798" font-family="DejaVu Sans" font-size="33" font-weight="400" text-anchor="start" fill="#D9E4EA" >По официальному сравнению версий Kling</text><text x="80" y="856" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#D9E4EA" >Редакционная схема · RealVibe</text>
