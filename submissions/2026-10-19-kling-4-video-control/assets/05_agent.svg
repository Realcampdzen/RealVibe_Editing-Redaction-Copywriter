-width="5" stroke-linecap="round" /><path d="M 1082,384 L 1098,397 L 1082,410" fill="none" stroke="#193149" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1065" y="270" font-family="DejaVu Sans" font-size="35" font-weight="700" text-anchor="middle" fill="#193149" >MCP или CLI</text><path d="M 1330,508 L 1330,537 Q 1330,558 1309,558 L 1238,558 Q 1218,558 1218,579 L 1218,591" fill="none" stroke="#193149" stroke-width="5" stroke-linecap="round"/><path d="M 1205,577 L 1218,593 L 1231,577" fill="none" stroke="#193149" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1000" y="610" width="436" height="175" rx="24" fill="#FFFFFF" stroke="#CBDAE0" stroke-width="2" /><circle cx="1036" cy="648" r="22" fill="#14253C"/><text x="1036" y="660" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" fill="#FFFFFF" >4</text><text x="1218" y="726" font-family="DejaVu Sans" font-size="43" font-weight="700" text-anchor="middle" fill="#193149" >Готовый файл</text><rect x="128" y="610" width="570" height="175" rx="24" fill="#D6EE83" /><circle cx="164" cy="643" r="22" fill="#14253C"/><text x="164" y="655" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" fill="#FFFFFF" >5</text><text x="413" y="708" font-family="DejaVu Sans" font-size="42" font-weight="700" text-anchor="middle" fill="#193149" >Просмотр результата</text><text x="413" y="759" font-family="DejaVu Sans" font-size="34" font-weight="400" text-anchor="middle" fill="#193149" >Кадры · речь · финал</text><line x1="979" y1="697" x2="724" y2="697" stroke="#193149" stroke-width="5" stroke-linecap="round" /><path d="M 737,684 L 721,697 L 737,710" fill="none" stroke="#193149" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="856" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#51677C" >Редакционная схема · RealVibe</text>
