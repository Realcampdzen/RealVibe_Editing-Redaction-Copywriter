<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Видеозадача через внешнего ИИ-агента</title>
<desc id="description">Оригинальная редакционная схема процесса с внешним ИИ-агентом, а не снимок встроенного Canvas. Задание и исходники передают агенту. Агент обращается к Kling 4.0 через MCP или CLI, получает готовый файл. Человек просматривает конкретный ролик, проверяя кадры, речь и финал.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#EFF4F5" />
